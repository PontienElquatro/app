<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultation patient - MONGANGA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body { margin: 0; background: #090d14; color: #f8fafc; font-family: var(--font); }
    .doctor-call { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .call-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 22px; background: #111827; border-bottom: 1px solid rgba(255,255,255,.08); }
    .call-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .08em; }
    .call-brand i { color: #60a5fa; }
    .patient-state { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; }
    .state-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .call-main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }
    .video-stage { position: relative; display: grid; place-items: center; background: radial-gradient(circle at center, #1e293b, #090d14 68%); }
    .patient-avatar { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #3c50e0, #6475f2); font-size: 52px; font-weight: 800; box-shadow: 0 20px 60px rgba(60,80,224,.35); }
    .patient-label { position: absolute; left: 22px; bottom: 22px; font-size: 13px; color: #cbd5e1; }
    .self-view { position: absolute; right: 22px; bottom: 22px; width: 160px; height: 112px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: #1e293b; color: #94a3b8; font-size: 12px; }
    .call-side { display: flex; flex-direction: column; background: #111827; border-left: 1px solid rgba(255,255,255,.08); min-height: 0; }
    .side-tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,.08); }
    .side-tab { flex: 1; border: 0; background: transparent; color: #94a3b8; padding: 15px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .side-tab.active { color: #fff; border-bottom: 2px solid #60a5fa; }
    .side-panel { display: none; flex: 1; min-height: 0; padding: 18px; overflow: auto; }
    .side-panel.active { display: block; }
    .chat-message { margin-bottom: 16px; font-size: 12.5px; line-height: 1.5; color: #cbd5e1; }
    .chat-message strong { display: block; color: #60a5fa; font-size: 10px; text-transform: uppercase; margin-bottom: 3px; }
    .note-area { width: 100%; min-height: 190px; resize: vertical; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; padding: 12px; font: inherit; font-size: 12.5px; }
    .call-chat { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }
    .call-chat input { min-width: 0; flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 999px; color: #fff; padding: 10px 13px; }
    .call-chat button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #3c50e0; color: #fff; cursor: pointer; }
    .call-controls { display: flex; justify-content: center; gap: 12px; padding: 16px; background: #111827; border-top: 1px solid rgba(255,255,255,.08); }
    .call-control { width: 48px; height: 48px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; background: #1e293b; color: #fff; cursor: pointer; }
    .call-control.active { background: #3c50e0; }
    .call-control.end { background: #dc2626; border-color: #dc2626; }
    @media (max-width: 860px) { .call-main { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) 290px; } .call-side { border-left: 0; border-top: 1px solid rgba(255,255,255,.08); } .self-view { width: 120px; height: 84px; } }
    @media (max-width: 520px) { .call-header { padding: 12px 14px; } .patient-avatar { width: 110px; height: 110px; font-size: 38px; } .call-controls { gap: 8px; } .call-control { width: 42px; height: 42px; } }
  </style>
</head>
<body>
  <main class="doctor-call">
    <header class="call-header">
      <div class="call-brand"><i data-lucide="activity"></i> MONGANGA <span style="color:#64748b; font-size:11px; letter-spacing:0;">Consultation médecin</span></div>
      <div class="patient-state"><span class="state-dot"></span><span id="patient-name">Patient en ligne</span><span id="call-timer">00:00</span></div>
    </header>
    <section class="call-main">
      <div class="video-stage">
        <div class="patient-avatar">AM</div>
        <div class="patient-label"><strong id="patient-label">Aline Nkulu</strong><br>Consultation de suivi</div>
        <div class="self-view">Votre caméra</div>
      </div>
      <aside class="call-side">
        <div class="side-tabs"><button class="side-tab active" onclick="showPanel('chat', this)"><i data-lucide="message-square"></i> Chat</button><button class="side-tab" onclick="showPanel('notes', this)"><i data-lucide="clipboard-list"></i> Notes</button></div>
        <div class="side-panel active" id="chat-panel"><div id="chat-messages"><div class="chat-message"><strong>Aline Nkulu</strong>Bonjour docteur, je suis prête pour la consultation.</div></div></div>
        <div class="side-panel" id="notes-panel"><label for="clinical-notes" style="font-size:12px; color:#cbd5e1;">Notes privées de consultation</label><textarea id="clinical-notes" class="note-area" placeholder="Ajoutez vos observations..."></textarea><button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="saveNotes()"><i data-lucide="save"></i> Enregistrer les notes</button></div>
        <div class="call-chat" id="chat-composer"><input id="chat-input" placeholder="Écrire un message..." onkeydown="if(event.key === 'Enter') sendMessage()"><button onclick="sendMessage()" aria-label="Envoyer"><i data-lucide="send"></i></button></div>
      </aside>
    </section>
    <footer class="call-controls"><button class="call-control" onclick="toggleCallControl(this, 'mic')" title="Microphone" aria-label="Activer ou désactiver le microphone"><i data-lucide="mic"></i></button><button class="call-control" onclick="toggleCallControl(this, 'cam')" title="Caméra" aria-label="Activer ou désactiver la caméra"><i data-lucide="video"></i></button><button class="call-control" onclick="document.getElementById('call-file').click()" title="Envoyer un document" aria-label="Envoyer un document"><i data-lucide="paperclip"></i></button><button class="call-control" onclick="toggleFullscreen()" title="Plein écran" aria-label="Activer le plein écran"><i data-lucide="maximize"></i></button><button class="call-control end" onclick="endCall()" title="Terminer l'appel" aria-label="Terminer l'appel"><i data-lucide="phone-off"></i></button></footer>
  </main>
  <input id="call-file" type="file" accept="image/*,.pdf,.doc,.docx" hidden onchange="attachFile(this)">
  <script src="../assets/js/app.js"></script>
  <script>
    let seconds = 0;
    setInterval(() => { seconds++; document.getElementById('call-timer').textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`; }, 1000);
    const patient = new URLSearchParams(location.search).get('patient');
    if (patient === 'mwamba') { document.getElementById('patient-name').textContent = 'M. Mwamba en ligne'; document.getElementById('patient-label').textContent = 'M. Mwamba'; }
    function showPanel(panel, button) { document.querySelectorAll('.side-panel').forEach(item => item.classList.remove('active')); document.querySelectorAll('.side-tab').forEach(item => item.classList.remove('active')); document.getElementById(`${panel}-panel`).classList.add('active'); button.classList.add('active'); document.getElementById('chat-composer').style.display = panel === 'chat' ? 'flex' : 'none'; }
    function sendMessage() { const input = document.getElementById('chat-input'); const text = input.value.trim(); if (!text) return; const message = document.createElement('div'); message.className = 'chat-message'; message.innerHTML = `<strong>Vous</strong>${text.replace(/[&<>]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]))}`; document.getElementById('chat-messages').appendChild(message); input.value = ''; }
    function saveNotes() { localStorage.setItem('monganga_doctor_notes', document.getElementById('clinical-notes').value); Monganga.showToast('Notes enregistrées localement', 'success'); }
    function toggleCallControl(button, type) { button.classList.toggle('active'); button.querySelector('[data-lucide]').setAttribute('data-lucide', button.classList.contains('active') ? `${type === 'mic' ? 'mic' : 'video'}-off` : type); Monganga.initLucide(); }
    function attachFile(input) { const file = input.files[0]; if (!file) return; if (file.size > 10 * 1024 * 1024) { Monganga.showToast('Le fichier doit faire 10 Mo maximum', 'error'); return; } Monganga.showToast(`${file.name} prêt à être envoyé`, 'success'); input.value = ''; }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
    function endCall() { if (!confirm('Terminer la consultation avec ce patient ?')) return; Monganga.showToast('Consultation terminée', 'success'); setTimeout(() => location.href = 'dashboard.html', 800); }
    document.addEventListener('DOMContentLoaded', () => { const savedNotes = localStorage.getItem('monganga_doctor_notes'); if (savedNotes) document.getElementById('clinical-notes').value = savedNotes; });
  </script>
</body>
</html>
