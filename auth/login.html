<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MONGANGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/animations.css">
<style>
  .auth-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1C2434 0%, #0F172A 100%);
    padding: 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-wrapper::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(60, 80, 224, 0.25) 0%, transparent 70%);
    top: -200px; right: -200px;
    pointer-events: none;
  }
  .auth-wrapper::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(60, 80, 224, 0.15) 0%, transparent 70%);
    bottom: -150px; left: -100px;
    pointer-events: none;
  }
  .auth-card {
    background: #FFFFFF;
    width: 100%;
    max-width: 440px;
    border-radius: var(--r-lg);
    padding: 40px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.25);
    position: relative;
    z-index: 1;
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 26px;
  }
  .auth-brand-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary) 0%, #5B6FF0 100%);
    border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(60, 80, 224, 0.35);
    transition: transform var(--t);
    overflow: hidden;
  }
  .auth-brand-icon.logo-image-wrap {
    background: transparent;
    box-shadow: none;
    padding: 0;
  }
  .auth-brand-icon.logo-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .auth-brand-icon:hover { transform: rotate(-8deg) scale(1.05); }
  .auth-brand-icon [data-lucide] { width: 22px; height: 22px; }
  .auth-brand-text { font-size: 20px; font-weight: 800; color: #0F172A; letter-spacing: -0.3px; }
  .auth-title { font-size: 22px; font-weight: 800; text-align: center; color: #0F172A; margin-bottom: 6px; }
  .auth-subtitle { font-size: 13px; color: #64748B; text-align: center; margin-bottom: 26px; }
  .auth-footer { margin-top: 20px; text-align: center; font-size: 13px; color: #64748B; }
  .auth-link { color: var(--primary); font-weight: 700; cursor: pointer; }
  .auth-link:hover { text-decoration: underline; }
  .auth-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: #64748B; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: color var(--t);
  }
  .auth-back:hover { color: var(--primary); }
  .auth-back [data-lucide] { width: 14px; height: 14px; }
  .demo-hint {
    background: #EFF6FF;
    border: 1px solid #BFDBFE;
    color: #1D4ED8;
    font-size: 12px;
    padding: 12px 14px;
    border-radius: var(--r-sm);
    margin-top: 20px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
  }
  .demo-hint [data-lucide] { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
  .demo-hint code {
    background: rgba(29, 78, 216, 0.1);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
  }
  .role-chips {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .role-chip {
    font-size: 11px;
    padding: 4px 10px;
    background: rgba(29, 78, 216, 0.08);
    border-radius: var(--r-full);
    font-weight: 600;
    cursor: pointer;
    transition: all var(--t);
  }
  .role-chip:hover { background: rgba(29, 78, 216, 0.18); }
</style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <a class="auth-back" href="../index.html">
      <i data-lucide="arrow-left"></i> Retour à l'accueil
    </a>

    <div class="auth-brand" style="margin-top: 18px;">
      <div class="auth-brand-icon logo-image-wrap"><img src="../assets/logo/monganga-icone.jpg" alt="MONGANGA"></div>
      <span class="auth-brand-text">MONGANGA</span>
    </div>

    <h1 class="auth-title">Bon retour</h1>
    <p class="auth-subtitle">Connectez-vous pour accéder à votre espace</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email ou téléphone</label>
        <div class="input-wrap">
          <i data-lucide="mail" class="icon-left"></i>
          <input type="text" id="loginEmail" class="form-input" placeholder="vous@monganga.cd" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <div class="input-wrap">
          <i data-lucide="lock" class="icon-left"></i>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required style="padding-right: 42px;">
          <i data-lucide="eye" class="icon-right" onclick="togglePassword('loginPassword', this)" style="cursor:pointer;"></i>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <label style="font-size:12px; display:flex; gap:6px; align-items:center; cursor:pointer; color: #64748B;">
          <input type="checkbox" style="accent-color: var(--primary);"> Se souvenir
        </label>
        <a class="auth-link" style="font-size:12px;" onclick="forgotPassword()">Mot de passe oublié ?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block">
        Se connecter <i data-lucide="arrow-right"></i>
      </button>
    </form>

    <div class="demo-hint">
      <i data-lucide="info"></i>
      <div>
        <strong>Démo :</strong> tapez n'importe quel email, le rôle est détecté automatiquement.
        <div class="role-chips">
          <span class="role-chip" onclick="fillDemo('admin@monganga.cd')">Admin</span>
          <span class="role-chip" onclick="fillDemo('dr.ilunga@monganga.cd')">Médecin</span>
          <span class="role-chip" onclick="fillDemo('aline@email.com')">Patient</span>
        </div>
      </div>
    </div>

    <div class="auth-footer">
      Pas encore de compte ?
      <a class="auth-link" href="register.html">Créer un compte</a>
    </div>

  </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  // Toggle visibilité mot de passe
  function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    icon.setAttribute('data-lucide', isPassword ? 'eye-off' : 'eye');
    Monganga.initLucide();
  }

  // Remplir un email de démo
  function fillDemo(email) {
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = 'demo1234';
    document.getElementById('loginPassword').focus();
  }

  // Mot de passe oublié
  function forgotPassword() {
    Monganga.showToast('Un lien de réinitialisation a été envoyé à votre email', 'info');
  }

  // Login avec détection de rôle
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.toLowerCase().trim();

    let role = 'patient';
    let destination = '../patient/dashboard.html';

    if (email.includes('admin')) {
      role = 'admin';
      destination = '../admin/dashboard.html';
    } else if (
      email.includes('doctor') ||
      email.includes('medecin') ||
      email.includes('médecin') ||
      email.startsWith('dr.') ||
      email.startsWith('dr@')
    ) {
      role = 'doctor';
      destination = '../doctor/dashboard.html';
    }

    // Message personnalisé selon le rôle
    const messages = {
      admin: 'Connexion réussie. Redirection vers l\'espace administrateur...',
      doctor: 'Connexion réussie. Redirection vers votre espace médecin...',
      patient: 'Connexion réussie. Redirection vers votre espace patient...'
    };

    if (window.MongangaApi) {
      MongangaApi.setSession({
        token: `demo-${role}-${Date.now()}`,
        role,
        email,
        demo: true
      });
    }

    Monganga.showToast(messages[role], 'success');

    // Animation de chargement du bouton
    const btn = e.target.querySelector('button[type="submit"]');
    const originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="loader" style="border-color: rgba(255,255,255,0.3); border-top-color: #fff; width: 18px; height: 18px;"></span> Connexion...';

    setTimeout(() => {
      window.location.href = destination;
    }, 1200);
  }

  // Focus auto sur l'email au chargement
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => document.getElementById('loginEmail').focus(), 300);
  });
</script>
</body>
</html>
